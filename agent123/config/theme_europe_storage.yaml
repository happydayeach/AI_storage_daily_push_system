theme_id: "europe_storage"
keywords_matrix:
  - ["数据保护", "GDPR", "云存储", "合规"]
  - ["分布式", "边缘存储", "多云", "数据湖"]
  - ["闪存", "NAND", "SSD", "存储芯片"]
source_whitelist: []   # 空表示不限制
source_blacklist: ["reuters.com", "bloomberg.com"]  # 示例黑名单（实际可调）
categories:
  - "产业热点"
  - "垂直行业热点"
  - "监管与合规"
  - "产品与技术"
analysis_template_sections: ["背景", "技术分析", "市场影响", "竞对信号"]
theme_colors: {primary: "#1a5fb4", accent: "#e66100"}
icon_map: {财报: "📈", 产品发布: "🚀", 监管: "⚖️", 合作: "🤝", 并购: "🏦", 漏洞: "🔒", 其他: "📌"}
push_targets:
  - channel: "wechat"  # Pushplus 默认微信渠道
  - channel: "webhook"  # 飞书、企业微信等通过 Pushplus webhook 渠道转发
    option: "your_webhook_code"  # Pushplus 后台 webhook 渠道编码
